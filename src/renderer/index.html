<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>AI Control Center</title>
  </head>
  <body>
    <div class="window" id="window">
      <div class="backdrop" aria-hidden="true">
        <div class="aurora aurora-a"></div>
        <div class="aurora aurora-b"></div>
      </div>

      <header class="titlebar">
        <div class="titlebar-leading">
          <!-- macOS-style window controls (frameless Linux/Windows; macOS has the native ones here) -->
          <div class="window-controls" id="window-controls">
            <button class="wc-btn wc-close" id="wc-close" type="button" aria-label="Fermer"></button>
            <button class="wc-btn wc-min" id="wc-min" type="button" aria-label="Réduire"></button>
            <button class="wc-btn wc-max" id="wc-max" type="button" aria-label="Agrandir"></button>
          </div>
        </div>
        <div class="titlebar-spacer"></div>
        <div class="titlebar-trailing">
          <div class="nav-pill glass">
            <button class="icon-btn" id="nav-back" type="button" aria-label="Précédent"></button>
            <button class="icon-btn" id="nav-forward" type="button" aria-label="Suivant"></button>
            <button class="icon-btn nav-reload" id="nav-reload" type="button" aria-label="Recharger"></button>
          </div>
        </div>
      </header>

      <nav class="rail glass" aria-label="Intelligences artificielles">
        <div class="rail-indicator" id="rail-indicator" aria-hidden="true"></div>
        <ul class="rail-list" id="rail-list"></ul>
        <div class="rail-footer">
          <button class="icon-btn rail-settings" id="rail-settings" type="button" aria-label="Réglages"></button>
          <button class="icon-btn rail-toggle" id="rail-toggle" type="button" aria-label="Afficher les noms"></button>
        </div>
      </nav>

      <main class="stage">
        <div class="card" id="content"></div>
        <section class="settings glass" id="settings" aria-label="Réglages" hidden></section>
        <section class="login-overlay" id="login-overlay" aria-live="polite" hidden></section>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
