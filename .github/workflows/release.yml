# Builds the Linux AppImage, the macOS dmgs (arm64 + x64) and the Windows installer, and attaches
# them to a GitHub release when a v* tag is pushed. A manual run builds only and keeps the files as
# artifacts. All builds are unsigned; Windows can optionally be signed by setting WIN_CSC_*
# (see docs/SIGNING.md).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
            files: dist/*.AppImage
          - os: macos-latest
            target: --mac dmg --arm64 --x64
            files: dist/*.dmg
          - os: windows-latest
            target: --win nsis --x64
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Unsigned macOS build (identity:null in config); don't search the keychain for a cert.
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder ${{ matrix.target }} --publish never
          elif [ "${{ matrix.os }}" = "windows-latest" ] && [ -n "$WIN_CSC_LINK" ]; then
            # Optional Windows cert present (a usable .p12): sign the installer. See docs/SIGNING.md.
            export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
            npx electron-builder ${{ matrix.target }} --publish never
          else
            npx electron-builder ${{ matrix.target }} --publish never
          fi
        env:
          # Windows signing — optional; most public certs now need hardware/cloud HSM (see docs).
          # Named WIN_* (not CSC_*) so an empty secret never makes electron-builder try to sign.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v5
        with:
          name: packages-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: packages
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la packages
          # Re-running a tag updates its existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AI Control Center ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
