# Builds the Linux AppImage, the macOS dmgs (arm64 + x64) and the Windows installer, and attaches
# them to a GitHub release when a v* tag is pushed. A manual run builds only and keeps the files as
# artifacts. macOS is signed + notarized when the Developer ID secrets are set (see README);
# otherwise it is built unsigned.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
            files: dist/*.AppImage
          - os: macos-latest
            target: --mac dmg --arm64 --x64
            files: dist/*.dmg
          - os: windows-latest
            target: --win nsis --x64
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$CSC_LINK" ]; then
            # Developer ID cert present: sign and notarize (then the dmg opens without xattr).
            npx electron-builder ${{ matrix.target }} --publish never -c.mac.notarize=true
          else
            npx electron-builder ${{ matrix.target }} --publish never
          fi
        env:
          # macOS signing / notarization — all optional; absent ⇒ unsigned build.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Only hunt for a signing identity when a certificate was actually provided.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}

      - uses: actions/upload-artifact@v5
        with:
          name: packages-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: packages
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la packages
          # Re-running a tag updates its existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AI Control Center ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
