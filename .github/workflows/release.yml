# Builds the Linux AppImage and the macOS dmgs (arm64 + x64), and attaches them to a GitHub
# release when a v* tag is pushed. A manual run builds only and keeps the files as artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
            files: dist/*.AppImage
          - os: macos-latest
            target: --mac dmg --arm64 --x64
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Unsigned macOS build: do not look for a signing identity in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v5
        with:
          name: packages-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: packages
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la packages
          # Re-running a tag updates its existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AI Control Center ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
