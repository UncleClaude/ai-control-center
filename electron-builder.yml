# electron-builder: AppImage (Linux) and dmg (macOS). The Arch package uses packaging/arch/PKGBUILD.
appId: io.github.ai-control-center
productName: AI Control Center
copyright: AI Control Center contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: resources
asar: true

linux:
  # Linux keeps the lowercase executable / WM class (desktop entry, tray, blur rules rely on it);
  # macOS uses productName so the bundle is "AI Control Center.app".
  executableName: ai-control-center
  target:
    - AppImage
  category: Network
  icon: build/icon.png
  synopsis: Muse, Claude and ChatGPT in one glass window
  description: Desktop app gathering the web apps of your AIs, with notifications when they finish or need you.
  desktop:
    entry:
      Name: AI Control Center
      StartupWMClass: ai-control-center
      Keywords: AI;Claude;ChatGPT;Muse;Chat;
appImage:
  artifactName: AI-Control-Center-${version}-${arch}.AppImage

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Unsigned by default (SmartScreen warns once). Set WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD to sign.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: AI-Control-Center-${version}-Setup-${arch}.exe
  shortcutName: AI Control Center
  uninstallDisplayName: AI Control Center

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Unsigned by default (identity null). The release workflow overrides this with
  # `-c.mac.identity="Developer ID Application"` and imports a cert only when the signing secrets
  # exist, then signs + notarizes so the dmg opens without the Gatekeeper quarantine step.
  identity: null
  extendInfo:
    NSMicrophoneUsageDescription: The AIs use the microphone for voice mode.
    NSCameraUsageDescription: The AIs may use the camera when you ask them to.
dmg:
  title: AI Control Center
  artifactName: AI-Control-Center-${version}-${arch}.dmg
